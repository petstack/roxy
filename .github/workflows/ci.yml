name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Verifies roxy on Windows (amd64 + arm64). The Unix-socket FastCGI path is
# `#[cfg(unix)]`-gated out on Windows, so this guards the gated build against
# regressions and runs the test suite natively on each architecture.
jobs:
  windows:
    name: test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
